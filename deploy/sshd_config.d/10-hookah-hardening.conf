# SSH: вход только по ключу, без root и без паролей. Куда: /etc/ssh/sshd_config.d/10-hookah-hardening.conf
#
# ВНИМАНИЕ: ошибка здесь — и в сервер не войти. Применяйте строго так:
#   1. Вы уже входите по ключу как обычный пользователь с sudo (не root): ssh имя@адрес-сервера.
#   2. Держите эту сессию ОТКРЫТОЙ до конца проверки — через неё всё можно откатить.
#   3. Поставьте файл, подставив своё имя вместо CHANGE_ME_USERNAME (команда делает это сама, $USER — вы):
#        sed "s/CHANGE_ME_USERNAME/$USER/" deploy/sshd_config.d/10-hookah-hardening.conf | sudo tee /etc/ssh/sshd_config.d/10-hookah-hardening.conf
#   4. Проверка и перезапуск:  sudo sshd -t && sudo systemctl restart ssh
#      (sshd -t ищет ошибки; если он что-то написал — ничего не перезапускайте и исправьте файл)
#   5. В НОВОМ окне терминала: ssh имя@адрес-сервера. Вошли — готово, старую сессию можно закрыть.
#      Не пускает — в старой сессии: sudo rm /etc/ssh/sshd_config.d/10-hookah-hardening.conf && sudo systemctl restart ssh
#
# Имя файла начинается с 10-: sshd берёт ПЕРВОЕ встретившееся значение каждой настройки, поэтому наш файл важнее,
# чем 50-cloud-init.conf, где у облачных серверов часто стоит PasswordAuthentication yes.

PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
PubkeyAuthentication yes
AuthenticationMethods publickey
MaxAuthTries 3
LoginGraceTime 20
X11Forwarding no
AllowAgentForwarding no
# Отключать неотвечающие сеансы примерно через 10 минут.
ClientAliveInterval 300
ClientAliveCountMax 2
# Входить можно только этим пользователям (через пробел). Имя заменяется командой из шага 3.
AllowUsers CHANGE_ME_USERNAME
