# nginx перед сервером: HTTPS, ограничение частоты по IP, проксирование на Node.
# В .env сервера: TRUST_PROXY=1, NODE_ENV=production.
limit_req_zone $binary_remote_addr zone=hp_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=hp_auth:10m rate=17r/h;

server {
    listen 443 ssl http2;
    server_name hookahparty.example;            # ваш домен
    ssl_certificate     /etc/letsencrypt/live/hookahparty.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hookahparty.example/privkey.pem;
    client_max_body_size 600k;

    location /api/auth/ {
        limit_req zone=hp_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
    }
    location /api/ {
        limit_req zone=hp_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
    }
}
server {
    listen 80;
    server_name hookahparty.example;
    return 301 https://$host$request_uri;
}
