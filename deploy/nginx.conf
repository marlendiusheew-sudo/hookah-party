# nginx перед сервером Hookah Party: HTTPS, ограничение частоты и одновременных запросов, проксирование на Node (127.0.0.1:3000).
# Куда: /etc/nginx/sites-available/hookah-party, домен hookahparty.example заменяется на ваш:
#   sudo sed "s/hookahparty.example/$DOMAIN/g" deploy/nginx.conf | sudo tee /etc/nginx/sites-available/hookah-party
#   sudo nginx -t && sudo systemctl reload nginx
# Сертификат нужен до этого файла: сначала deploy/nginx-bootstrap.conf и certbot (deploy/SERVER-SETUP.md, шаг 11).
# В .env сервера: TRUST_PROXY=1, NODE_ENV=production.
# Рассчитано на nginx 1.24 из Ubuntu 24.04. В nginx 1.25+ вместо «listen ... ssl http2» пишут «listen ... ssl» и «http2 on;».

# Кого лимиты считают одним посетителем: IPv4 — один адрес, IPv6 — всю сеть /64 (первые 8 байт адреса из 16).
# Провайдер выдаёт одному устройству или дому целую сеть /64 — 2^64 адресов. Если считать по полному адресу, достаточно
# брать новый адрес на каждый запрос, и ни один лимит не сработает. IPv4 внутри IPv6 (::ffff:a.b.c.d — бывает, если
# слушать [::] с ipv6only=off) — это один IPv4-адрес: его считаем целиком, иначе все IPv4-посетители слились бы в одного.
map $binary_remote_addr $hp_client {
    "~^\x00{10}\xff\xff"  $binary_remote_addr;
    "~(?s)^(.{8}).{8}$"   $1;
    default               $binary_remote_addr;
}

# Частота запросов с одного посетителя. nginx умеет только r/s и r/m (не r/h). Лимит «17 попыток входа в час» держит сам
# сервер; здесь — защита от потока: к /api/auth/ сразу 11 запросов, дальше 5 в минуту, к остальному API — 10 в секунду.
limit_req_zone $hp_client zone=hp_api:10m rate=10r/s;
limit_req_zone $hp_client zone=hp_auth:10m rate=5r/m;
# Одновременные запросы от одного посетителя (limit_conn в server ниже). Общего потолка на весь сайт нет намеренно:
# несколько адресов с медленными запросами заняли бы его и закрыли сайт для всех.
limit_conn_zone $hp_client zone=hp_conn:10m;

# Постоянные соединения с Node. Node закрывает простаивающее соединение через 5 секунд, поэтому nginx отпускает его раньше —
# иначе изредка отправлял бы запрос в уже закрываемое соединение и отдавал посетителю ошибку 502.
upstream hookah_node {
    server 127.0.0.1:3000;
    keepalive 16;
    keepalive_timeout 4s;
}

# Запросы по IP-адресу сервера или с чужим именем (сканеры, подмена Host) — молча закрываем.
# Эти серверы по умолчанию первыми принимают КАЖДОЕ соединение: пока оно не представилось (TLS-рукопожатие, а по HTTP/1 —
# и заголовки первого запроса), действует их client_header_timeout, а не сайта. По умолчанию это 60 секунд — ставим 10,
# как у сайта, иначе соединения, которые ничего не присылают (slowloris), висели бы минуту. reset_timedout_connection —
# соединения, закрытые по таймауту или кодом 444, сбрасываются сразу и не держат память ядра.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    client_header_timeout 10s;
    reset_timedout_connection on;
    return 444;
}
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    ssl_reject_handshake on;
    client_header_timeout 10s;
    reset_timedout_connection on;
    return 444;
}

# HTTP → HTTPS. Здесь же Let's Encrypt проверяет домен при продлении сертификата.
server {
    listen 80;
    listen [::]:80;
    server_name hookahparty.example;
    server_tokens off;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hookahparty.example;
    # Не показывать версию nginx; на превышение лимита частоты — код 429, а не 503.
    server_tokens off;
    limit_req_status 429;

    ssl_certificate     /etc/letsencrypt/live/hookahparty.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hookahparty.example/privkey.pem;
    # Только TLS 1.2 и 1.3 и шифры с forward secrecy (профиль Mozilla «intermediate»).
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_ecdh_curve X25519:prime256v1:secp384r1;
    ssl_session_timeout 1d;
    ssl_session_cache shared:hp_tls:10m;
    ssl_session_tickets off;
    # OCSP stapling не включаем: Let's Encrypt с 2025 года не поддерживает OCSP (отзыв проверяется по CRL),
    # nginx только писал бы предупреждение. Если сертификат будет от центра с OCSP — раскомментируйте:
    # ssl_stapling on; ssl_stapling_verify on; resolver 1.1.1.1 9.9.9.9 valid=300s; resolver_timeout 5s;

    # HSTS ставит nginx, чтобы он был и на его собственных ответах (429, 502); такой же заголовок от Node убираем,
    # чтобы не было двух. preload не включён: это решение «навсегда», выйти из списка браузеров долго.
    proxy_hide_header Strict-Transport-Security;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Размер запроса — как у сервера (512 КБ; фото профиля сервер принимает до 100 КБ). Тело держим в памяти, не во временных файлах.
    client_max_body_size 512k;
    client_body_buffer_size 512k;
    # Таймауты против «медленных» атак (slowloris): клиент обязан присылать данные без долгих пауз.
    # Не уложился (например, нарочно медленно читает ответ) — соединение сбрасываем, память освобождается сразу.
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 15s;
    keepalive_timeout 30s;
    reset_timedout_connection on;

    # Одновременных запросов от одного посетителя (IPv4-адрес или IPv6-сеть /64) — до 50, ко всему сайту — до 256;
    # сверх — 429, как при превышении частоты. Первое открытие страницы — ~15 файлов сразу, так что запас есть и для
    # нескольких человек за одним IP мобильного оператора. Общий предел держит память Node в рамках MemoryMax
    # (deploy/hookah-party.service) и бережёт соединения самого nginx: в Ubuntu их 768 на рабочий процесс
    # (worker_connections в /etc/nginx/nginx.conf), а каждый запрос к Node занимает ещё одно — с Node.
    limit_conn hp_conn 50;
    limit_conn_status 429;

    # Настоящий IP посетителя для сервера. Заголовок X-Forwarded-For ПЕРЕЗАПИСЫВАЕМ адресом соединения, а не дописываем
    # (как делает стандартный proxy_params): иначе посетитель подставил бы туда любой адрес, обходил лимиты по IP
    # и через fail2ban добивался бана чужих адресов. Сервер берёт последний адрес из этого заголовка (здесь он единственный).
    # Если позже включите Cloudflare: добавьте set_real_ip_from для его сетей и real_ip_header CF-Connecting-IP —
    # тогда $remote_addr станет адресом посетителя, а не Cloudflare.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 15s;
    proxy_read_timeout 30s;

    # В ответах API есть CSRF-токен, поэтому без сжатия (защита от атаки BREACH). Ошибки самого nginx — в JSON, как у сервера.
    location /api/auth/ {
        limit_req zone=hp_auth burst=10 nodelay;
        gzip off;
        error_page 429 = @api_429;
        error_page 413 = @api_413;
        error_page 502 503 504 = @api_down;
        proxy_pass http://hookah_node;
    }
    location /api/ {
        limit_req zone=hp_api burst=40 nodelay;
        gzip off;
        error_page 429 = @api_429;
        error_page 413 = @api_413;
        error_page 502 503 504 = @api_down;
        proxy_pass http://hookah_node;
    }
    location / {
        # Сайт — только чтение страниц и файлов.
        limit_except GET HEAD { deny all; }
        proxy_pass http://hookah_node;
    }

    # Тексты ошибок nginx для API: сайт покажет их так же, как ошибки сервера.
    location @api_429 { default_type application/json; return 429 '{"error":"rate_limited","message":{"ru":"Слишком много запросов. Подождите немного.","en":"Too many requests. Please wait a moment."}}'; }
    location @api_413 { default_type application/json; return 413 '{"error":"too_large","message":{"ru":"Слишком большой запрос.","en":"Request too large."}}'; }
    location @api_down { default_type application/json; return 503 '{"error":"server_down","message":{"ru":"Сервер перезапускается. Попробуйте через минуту.","en":"The server is restarting. Try again in a minute."}}'; }
}
