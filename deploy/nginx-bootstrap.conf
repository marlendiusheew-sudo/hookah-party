# nginx: временная настройка только на время получения ПЕРВОГО сертификата (обычный HTTP, без HTTPS).
# Основной deploy/nginx.conf ссылается на файлы сертификата, а без них nginx не запустится — поэтому сначала этот файл:
#   sudo mkdir -p /var/www/letsencrypt
#   sudo sed "s/hookahparty.example/$DOMAIN/g" deploy/nginx-bootstrap.conf | sudo tee /etc/nginx/sites-available/hookah-party
#   sudo ln -sf /etc/nginx/sites-available/hookah-party /etc/nginx/sites-enabled/hookah-party
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot certonly --webroot -w /var/www/letsencrypt -d $DOMAIN ...   (точная команда — в deploy/SERVER-SETUP.md)
# Затем этот файл заменяется на deploy/nginx.conf.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name hookahparty.example;
    server_tokens off;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 503; }
}
