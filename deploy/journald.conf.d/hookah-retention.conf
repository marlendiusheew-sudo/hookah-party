# journald: системные журналы хранятся не дольше 90 дней — так обещано в политике конфиденциальности
# (в журналах сервера есть IP-адреса). Сервер пишет журнал в stdout, systemd складывает его сюда же.
# Куда: /etc/systemd/journald.conf.d/hookah-retention.conf
#   sudo mkdir -p /etc/systemd/journald.conf.d
#   sudo cp deploy/journald.conf.d/hookah-retention.conf /etc/systemd/journald.conf.d/
#   sudo systemctl restart systemd-journald
# Проверка: journalctl --disk-usage    Самая старая запись: journalctl -o short-iso | head -1
# Журнал безопасности в базе (таблица audit) чистит сам сервер (server/lib/retention.js), тоже через 90 дней.

[Journal]
# Хранить на диске (переживает перезагрузку) — нужно, чтобы разбирать происшествия.
Storage=persistent
MaxRetentionSec=90day
# Новый файл журнала каждые сутки: старые записи удаляются целыми файлами, так срок соблюдается с точностью до дня.
MaxFileSec=1day
# И не больше 1 ГБ на диске.
SystemMaxUse=1G
