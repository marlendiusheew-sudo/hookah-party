# fail2ban: фильтр журнала Hookah Party. Куда: /etc/fail2ban/filter.d/hookah-party.conf
# Проверка на живом журнале:  sudo fail2ban-regex systemd-journal /etc/fail2ban/filter.d/hookah-party.conf
#
# Сервер пишет события безопасности одной строкой JSON (server/lib/guard.js → audit()), systemd кладёт их в journald:
#   {"at":"2026-10-23T10:00:00.000Z","level":"audit","type":"login_fail","userId":null,"ip":"203.0.113.7","detail":"+996 ••• ••• 001"}
#
# Считаем попыткой взлома (каждая строка — «штрафное очко» этому IP):
#   login_fail, lockout          — неверный пароль при входе (пятая ошибка подряд блокирует номер на 5 минут)
#   admin_unlock_fail            — неверный пароль или код из приложения (2FA) при открытии панели администратора
#   admin_denied                 — вошедший пользователь без прав обращается к API администратора
#   delete_fail, delete_locked   — неверный пароль при удалении аккаунта (это тоже подбор пароля)
#   password_change_fail, password_change_locked — неверный текущий пароль при смене пароля (подбор пароля из чужой сессии)
#   code_fail                    — неверный код из SMS (подбор кода при входе или регистрации)
# Намеренно НЕ считаем:
#   csrf_blocked — запрос с чужого сайта. Его отправляет браузер ЖЕРТВЫ, открывшей вредную страницу, — с её IP.
#                  Бан по нему позволил бы любому сайту заблокировать у нас посетителей, а то и целого мобильного
#                  оператора (у них один IP на тысячи абонентов). Такие запросы сервер и так отклоняет.
#   rate_limited «ph», «delete», «sms …» — лимит на НОМЕР: после атаки на номер его набирает и сам владелец,
#                  когда пытается войти (проверено: так легальный вход получал «штрафное очко»);
#   rate_limited (любой) — лимит частоты: за одним IP мобильного оператора сидят тысячи людей, и бан по лимиту
#                  закрыл бы сайт им всем. Частоту и так ограничивает само приложение.
#
# Подделать поля нельзя: в JSON кавычка внутри любого значения всегда записана как \", поэтому последовательность
# ","ip":" бывает только настоящей. <ADDR> — только IP-адрес: имя хоста не примется (и не будет искаться в DNS).
# Добавили в код новый тип неудачной попытки — допишите его в _types.

[Definition]

_types = login_fail|lockout|code_fail|admin_unlock_fail|admin_denied|delete_fail|delete_locked|password_change_fail|password_change_locked
_user  = (?:null|"[^"\\]*")

failregex = \{"at":"[^"]*","level":"audit","type":"(?:%(_types)s)","userId":%(_user)s,"ip":"<ADDR>"

ignoreregex =

[Init]

# Только строки нашего сервиса из journald.
journalmatch = _SYSTEMD_UNIT=hookah-party.service
