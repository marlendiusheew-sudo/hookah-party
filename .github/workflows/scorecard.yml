# OpenSSF Scorecard — независимая оценка безопасности репозитория: закреплены ли действия, какие права
# у токена, защищена ли ветка, обновляются ли зависимости и т. д. Итог — во вкладке Security → Code scanning
# и на https://scorecard.dev/viewer/?uri=github.com/marlendiusheew-sudo/hookah-party
# Сервис публикует результат, только если сценарий «чистый»: нет env и defaults на уровне сценария и задачи,
# нет прав на запись на уровне сценария, в задаче — только разрешённые действия и ни одного шага с run.
name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: '34 5 * * 6'
  # Чтобы проверка Branch-Protection обновлялась сразу после изменения правил защиты ветки.
  branch_protection_rule:

permissions: {}

# Новая отправка отменяет устаревший запуск; плановые запуски не отменяются.
concurrency:
  group: scorecard-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  analysis:
    name: Scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write # загрузка результатов в Code scanning
      id-token: write # подпись результатов (OIDC) для publish_results
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
